name: location_tracker_app
description: A simple location tracker app.
publish_to: 'none'

version: 2.3.0+9

environment:
  sdk: '>=3.0.5 <3.1.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  intl: ^0.18.1
  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  workmanager: ^0.5.2
  googleapis: ^11.4.0
  google_sign_in: ^6.1.5
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
